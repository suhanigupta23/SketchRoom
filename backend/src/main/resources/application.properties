server.port=${PORT:8080}
spring.application.name=sketchroom-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sketchroom}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis: URL takes precedence when supplied; separate variables remain supported.
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

app.websocket.url=${WS_URL:}
app.cors.allowed-origins=${CORS_ORIGINS:*}

logging.level.com.sketchroom=INFO

# Retain complete history. Reject further drawing at the limit instead of deleting old work.
app.board.max-events=${MAX_BOARD_EVENTS:50000}
