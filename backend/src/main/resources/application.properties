server.port=${PORT:8080}
spring.application.name=sketchroom-backend

# PostgreSQL:  Railway injects it automatically
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sketchroom}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

app.websocket.url=${WS_URL:wss://sketchroom-backend-production.up.railway.app/ws}
app.cors.allowed-origins=${CORS_ORIGINS:*}

logging.level.com.sketchroom=INFO
